name: Release Latest Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Prepare APK Asset
        run: |
          commit_sha=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/release/app-release.apk habits-tracker-$commit_sha.apk
          cp app/build/outputs/apk/release/app-release.apk habits-tracker-latest.apk
          echo "COMMIT_SHA=$commit_sha" >> $GITHUB_ENV

      - name: Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking if release 'latest-build' exists..."
          if ! gh release view latest-build >/dev/null 2>&1; then
            echo "Creating 'latest-build' release..."
            gh release create latest-build --title "Latest Build" --notes "This is the latest automated build."
          fi

          echo "Checking existing assets in release 'latest-build'..."
          assets=$(gh release view latest-build --json assets --jq '.assets[].name' 2>/dev/null || echo "")

          if [ -n "$assets" ]; then
            echo "Deleting existing assets: $assets"
            for asset in $assets; do
              gh release delete-asset latest-build "$asset" -y
            done
          else
            echo "No existing assets found."
          fi

          echo "Uploading new APK assets..."
          gh release upload latest-build habits-tracker-${{ env.COMMIT_SHA }}.apk habits-tracker-latest.apk

          echo "Updating release description with commit details..."
          commit_msg=$(git log -1 --pretty=%B | head -n 1)
          build_date=$(date -u +'%a %b %-d %H:%M:%S UTC %Y')

          echo "This release is automatically updated on every commit to the main branch." > release_notes.txt
          echo ">> " >> release_notes.txt
          echo ">> Latest Build Info:" >> release_notes.txt
          echo ">> " >> release_notes.txt
          echo ">>     Commit: ${{ env.COMMIT_SHA }}" >> release_notes.txt
          echo ">>     Message: $commit_msg" >> release_notes.txt
          echo ">>     Date: $build_date" >> release_notes.txt

          gh release edit latest-build \
            --title "Latest Build" \
            --notes-file release_notes.txt
